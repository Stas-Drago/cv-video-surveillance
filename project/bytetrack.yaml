# bytetrack.yaml
# Конфигурационный файл для трекера ByteTrack в YOLO

# Порог уверенности для детекции объектов
conf-thres: 0.25

# Порог IoU (Intersection over Union) для сопоставления объектов
iou-thres: 0.45

# Порог IoU для сопоставления треков
track-high-thr: 0.5

# Порог IoU для сопоставления треков с низкой уверенностью
track-low-thr: 0.1

# Порог уверенности для удаления треков
track-remove-thr: 0.5

# Максимальное время (в кадрах), которое объект может отсутствовать в кадре, прежде чем он будет удален из трека
reid-thr: 0.7

# Использование ReID (Re-Identification) для трекинга
use-reid: True

# Имя модели ReID
reid-model: "osnet_x0_25"

# Порог уверенности для ReID
reid-thr: 0.7

# Максимальное время (в кадрах), которое трек может существовать без обновления
max-age: 30

# Минимальное количество кадров для подтверждения трека
min-box-area: 10

# Использование движения для улучшения трекинга
motion: "kalman"